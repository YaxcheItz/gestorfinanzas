# Blueprint de Render: backend Kaptal
#
# Dashboard: New > Blueprint, apuntando a este repositorio.
#
# IMPORTANTE: el plan Free duerme el servicio tras 15 minutos sin trafico y
# tarda ~1 minuto en despertar. El workflow .github/workflows/keep-warm.yml
# lo mantiene despierto. Lee DEPLOY.md antes de tocar los limites de abajo.

services:
  - type: web
    name: kaptal-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    # Produccion despliega desde main. develop es integracion: llega aqui
    # antes de estar probado. Este campo es inmutable tras la creacion, asi
    # que cambiarlo despues exige borrar el servicio y crearlo de nuevo.
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
        value: finanzas
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_PROVIDER
        value: resend
      - key: JWT_SECRET
        generateValue: true
      # Sesion: access token corto y refresh token de 30 dias en cookie httpOnly.
      # MismoSite Lax alcanza mientras el frontend y la API compartan dominio, porque el
      # navegador no manda la cookie desde otro sitio. Si el frontend acaba en un dominio
      # distinto, Lax no llegaria: habria que poner None, dejar SECURE en true y anadir
      # proteccion CSRF al endpoint de refresh.
      - key: JWT_EXPIRATION_MS
        value: "900000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "2592000000"
      - key: JWT_REFRESH_SAME_SITE
        value: Lax
      - key: JWT_REFRESH_SECURE
        value: "true"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # CORS y FRONTEND_URL se rellenan tras desplegar el frontend, cuando
      # existe su dominio real. Dejarlos vacios ya no tumba el arranque: la
      # aplicacion tiene valor por defecto para ambos.
      - key: CORS_ORIGINS
        value: ""
      - key: FRONTEND_URL
        value: ""
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
