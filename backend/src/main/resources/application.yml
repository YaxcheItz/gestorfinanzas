server:
  port: ${PORT:8080}

spring:
  application:
    name: gestion-finanzas-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}
        format_sql: false
    show-sql: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

jwt:
  secret: ${JWT_SECRET}
  # Access token: vida corta a proposito. Si se filtra, el daño dura lo que dure este reloj.
  # El frontend lo renueva solo con el refresh token, asi que el usuario nunca ve el login.
  expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutos
  refresh:
    # Refresh token: la sesion que el usuario no nota. 30 dias renewing en cada uso, con
    # rotacion, de modo que un token robado deja de servir en cuanto se usa legitimamente.
    expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 dias
    cookie-name: ${JWT_REFRESH_COOKIE_NAME:finanzas_refresh}
    # Lax basta mientras el frontend y la API compartan dominio (kaptal.app), porque el
    # navegador no manda la cookie en peticiones de otro sitio. Si el frontend vive en otro
    # dominio, hay que poner None y activar secure, y ahi si conviene un token CSRF.
    same-site: ${JWT_REFRESH_SAME_SITE:Lax}
    secure: ${JWT_REFRESH_SECURE:true}

app:
  admin:
    # Correos que se promoted a ROLE_ADMIN al arrancar. Requerido para poder disparar
    # la revision de recordatorios o enviar WhatsApp de prueba a un numero arbitrario.
    emails: ${APP_ADMIN_EMAILS:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:no-reply@kaptal.app}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  ai:
    provider: ${AI_PROVIDER:gemini}
    model: ${AI_MODEL:gemini-2.5-flash}
    fallback-model: ${AI_FALLBACK_MODEL:gemini-flash-lite-latest}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

resend:
  api-key: ${RESEND_API_KEY:}
