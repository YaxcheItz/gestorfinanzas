server:
  port: ${PORT:8080}

spring:
  application:
    name: gestion-finanzas-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 5MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}
        format_sql: false
    show-sql: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

jwt:
  secret: ${JWT_SECRET}
  # Access token: vida corta a proposito. Si se filtra, el daño dura lo que dure este reloj.
  # El frontend lo renueva solo con el refresh token, asi que el usuario nunca ve el login.
  expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutos
  refresh:
    # Refresh token: la sesion que el usuario no nota. 30 dias renovandose en cada uso, con
    # rotacion, de modo que un token robado deja de servir en cuanto se usa legitimamente.
    expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 dias
    cookie-name: ${JWT_REFRESH_COOKIE_NAME:finanzas_refresh}
    # La app se sirve en vercel.app y la API en onrender.com, pero el frontend nunca llama a
    # onrender.com: el rewrite de vercel.json manda /api a Render y reenvia la respuesta. Asi
    # el navegador ve siempre kaptalgf.vercel.app, la cookie es de primera parte y no la
    # bloquean Firefox ni Safari como pasaria al cruzar sitios.
    # Lax alcanza porque la peticion es del mismo origen. Si alguien apuntara el frontend
    # otra vez al dominio de Render, habria que poner None, y entonces el filtro de cabecera
    # propia pasa a ser imprescindible en vez de una red de seguridad.
    same-site: ${JWT_REFRESH_SAME_SITE:Lax}
    secure: ${JWT_REFRESH_SECURE:true}

whatsapp:
  bot:
    phone: ${WHATSAPP_BOT_PHONE:5219515791240}
    verification-token: ${WHATSAPP_BOT_VERIFICATION_TOKEN:}

app:
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  admin:
    # Correos que se promoted a ROLE_ADMIN al arrancar. Requerido para poder disparar
    # la revision de recordatorios o enviar WhatsApp de prueba a un numero arbitrario.
    emails: ${APP_ADMIN_EMAILS:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:no-reply@kaptal.app}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://192.168.0.12:4200,http://127.0.0.1:4200}
  push:
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:mailto:soporte@kaptal.app}
  ai:
    provider: ${AI_PROVIDER:openai}
    model: ${AI_MODEL:gemini-2.5-flash}
    fallback-model: ${AI_FALLBACK_MODEL:gemini-flash-lite-latest}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_API_URL:https://api.groq.com/openai/v1}
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_API_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-4.1-mini}

resend:
  api-key: ${RESEND_API_KEY:}
