server:
  port: ${PORT:8080}

spring:
  application:
    name: gestion-finanzas-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}
        format_sql: false
    show-sql: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000 # 24 horas

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:no-reply@kaptal.app}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  ai:
    provider: ${AI_PROVIDER:gemini}
    model: ${AI_MODEL:gemini-2.5-flash}
    fallback-model: ${AI_FALLBACK_MODEL:gemini-flash-lite-latest}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

resend:
  api-key: ${RESEND_API_KEY:}
