spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:h2:mem:gestionfinanzas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${TEST_DATABASE_USERNAME:sa}
    password: ${TEST_DATABASE_PASSWORD:}
    driver-class-name: ${TEST_DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${TEST_DDL_AUTO:create-drop}
    properties:
      hibernate:
        default_schema: ${TEST_DATABASE_SCHEMA:PUBLIC}
        jdbc:
          time_zone: America/Mexico_City

  flyway:
    enabled: ${TEST_FLYWAY_ENABLED:false}
    default-schema: ${TEST_DATABASE_SCHEMA:PUBLIC}
    schemas: ${TEST_DATABASE_SCHEMA:PUBLIC}


jwt:
  secret: 0123456789abcdef0123456789abcdef
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: http://localhost:4200
