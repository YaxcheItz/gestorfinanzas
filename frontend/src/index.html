<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <title>Kaptal | Finanzas personales</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="kaptal.svg">
  <link rel="apple-touch-icon" href="icons/kaptal-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    body { margin:0; }
    .kaptal-launch { min-height:100svh; display:grid; place-content:center; justify-items:center; gap:16px; padding:24px; box-sizing:border-box; background:#F5F6F7; color:#17201C; font-family:system-ui,sans-serif; text-align:center; }
    .kaptal-launch img { width:64px; height:64px; }
    .kaptal-launch strong { font-size:24px; letter-spacing:-.04em; }
    .kaptal-launch p { margin:0; color:#5D6863; font-size:14px; }
    .kaptal-launch a { display:inline-flex; min-height:44px; align-items:center; padding:0 20px; border-radius:14px; background:#256747; color:#fff; text-decoration:none; }
    @media(prefers-color-scheme:dark) { .kaptal-launch { background:#111315; color:#F5F6F7; } .kaptal-launch p { color:#ABB5B0; } }
  </style>
</head>
<body>
  <app-root><div class="kaptal-launch" role="status"><img src="kaptal.svg" alt="" width="64" height="64"><strong>Kaptal</strong><p>Abriendo tu espacio…</p></div></app-root>
  <script src="startup-check.js"></script>
  <script src="runtime-config.js"></script>
  <noscript>Activa JavaScript para continuar usando Kaptal.</noscript>
</body>
</html>
