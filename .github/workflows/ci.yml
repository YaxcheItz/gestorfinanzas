name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rechazar consultas nativas sin cualificar
        run: |
          if grep -rn "nativeQuery[[:space:]]*=[[:space:]]*true" src/main/java; then
            echo "::error::Hay consultas nativas. El proyecto despliega con default_schema configurado, y PostgreSQL no las cualifica: fallan con 'relation does not exist'. Resuelvelas con JPQL."
            exit 1
          fi
          echo "Sin consultas nativas: OK"

      - name: Compilar y probar
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
